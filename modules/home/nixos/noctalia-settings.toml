[notification]
colorize_icons = false

[plugin_settings."yuta/meeting-bar"]
hide_empty = true
reminder_minutes = 7

[plugins]
enabled = [ "noctalia/translator", "hy4ri/herdr", "weinguyen/opencode-companion", "yuta/meeting-bar", "noctalia/timer" ]

[shell]
avatar_path = "/home/mitra/profile.jpg"
font_family = "Inter"
polkit_colorize_icons = false
screen_time_colorize_icons = false
screen_time_enabled = true
settings_show_advanced = true

    [shell.launcher]
    colorize_icons = false
    search_position = "top"
    show_app_actions = true
    show_app_origin_indicator = false
    show_session_button = false
    track_usage = false

        [shell.launcher.providers.session]
        global = true

    [shell.screenshot]
    show_cursor = true

    [shell.window_switcher]
    colorize_icons = false

[theme]
builtin = "Catppuccin"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
per_monitor_directories = true
transition = [ "fade" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 5800
    pause_on_fullscreen = true

    [wallpaper.default]
    path = "/home/mitra/Pictures/Wallpapers/milad-fakurian-E8Ufcyxz514-unsplash.jpg"

    [wallpaper.last]
    path = "/home/mitra/Pictures/Wallpapers/richard-horvath-cPccYbPrF-A-unsplash.jpg"

    [wallpaper.monitor.DP-1]
    directory = "/home/mitra/Pictures/Wallpapers/"
    directory_dark = "/home/mitra/Pictures/Wallpapers/"
    directory_light = "/home/mitra/Pictures/Wallpapers/"

    [wallpaper.monitor.DP-2]
    directory_light = "/home/mitra/Pictures/Wallpapers/vertical"

    [wallpaper.monitors.DP-1]
    path = "/home/mitra/Pictures/Wallpapers/richard-horvath-cPccYbPrF-A-unsplash.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/mitra/Pictures/Wallpapers/milad-fakurian-E8Ufcyxz514-unsplash.jpg"

[widget.active_window]
colorize_icons = false

[widget.bar]
type = "hy4ri/herdr:bar"

[widget.bar_2]
type = "yuta/meeting-bar:bar"

[widget.clock]
format = "{:%A, %B %d at %-I:%M %p}"

[widget.cpu]
enabled = false
show_value = true
visualization = "none"

[widget.media]
hide_when_no_media = true
max_length = 320

[widget.ram]
enabled = false
show_value = true
visualization = "none"

[widget.sysmon]
enabled = false
stat = "gpu_usage"
visualization = "none"

[widget.taskbar]
colorize_icons = false

[widget.temp]
enabled = false
show_value = true
visualization = "none"

[widget.tray]
colorize_icons = false
drawer = true

[widget.workspaces]
colorize_icons = false
empty_color = "tertiary"
